name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: daytimemobspawning-1.21.1
          path: build/libs/*.jar
